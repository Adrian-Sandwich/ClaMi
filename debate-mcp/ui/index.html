<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAGI — ClaMi</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="system">
    <header class="console-toolbar"><strong>MAGI / COUNCIL CONTROL</strong><span id="connection-status" role="status">Connecting…</span><button id="sound-toggle" aria-pressed="false">Sound: OFF</button><label class="volume-control">Volume <input id="sound-volume" aria-label="Sound volume" type="range" min="0" max="100" value="25"></label></header>
    <div class="magi" id="magi">
      <div class="header left"><hr><hr><span>INQUIRY</span><hr><hr></div>
      <div class="header right"><hr><hr><span>RESOLUTION</span><hr><hr></div>
      <div class="connection casper-balthasar"></div>
      <div class="connection casper-melchior"></div>
      <div class="connection balthasar-melchior"></div>
      <!-- wise-man / response / system-status / title los dibuja app.js -->
    </div>

    <div class="statusbar" id="statusbar">MAGI SYSTEM</div>

    <div id="conversation"></div>

    <div class="composer">
      <div class="modes" id="modes">
        <button data-mode="council" class="active">COUNCIL</button>
        <button data-mode="chat">CHAT</button>
      </div>
      <div class="decision-actions"><button id="c-new">＋ New question</button><button id="c-abort" hidden>Abort decision</button></div>
      <label class="input-label" for="c-input">Your message</label>
      <div class="intent" id="c-intent"></div>
      <div class="stalemate-actions" id="stalemate-actions" hidden>
        <span>the council disagrees — it's your call:</span>
        <button id="sa-ruling">close with my ruling</button>
        <button id="sa-segui">Continue with context</button>
      </div>
      <textarea id="c-input" rows="3"
        placeholder="Ask the council anything… Enter to send, Shift+Enter for a new line"></textarea>
      <div class="composer-opts">
        <label for="c-repo">Repository</label>
        <input id="c-repo" placeholder="repo folder (optional — pick or type)">
        <button id="c-browse" title="browse folders" aria-label="browse folders">📂</button>
      </div>
      <p id="repo-help">Optional: an approved plan will be implemented, reviewed and merged in this repository.</p>
      <div class="fs-panel" id="fs-panel" hidden>
        <div class="fs-bar">
          <button id="fs-up" hidden>⬆ up</button>
          <span id="fs-path"></span>
          <button id="fs-use">✓ use this folder</button>
        </div>
        <div class="fs-list" id="fs-list"></div>
      </div>
      <div class="send-row"><span>Enter to send · Shift+Enter for a new line</span><button id="c-send" disabled>Ask council</button></div>
      <div class="composer-hint" id="c-status" role="status" aria-live="polite"></div>
    </div>

    <div id="history"></div>

    <dialog class="modal" id="modal" aria-labelledby="modal-title">
      <div class="modal-header">
        <div class="modal-title" id="modal-title"></div>
        <button class="close" id="modal-close" aria-label="Close reasoning">X</button>
      </div>
      <div class="modal-body"><div id="modal-content"></div></div>
    </dialog>
  </div>
  <script>window.MAGI_TOKEN = "__MAGI_TOKEN__";</script>
  <script src="/sound.js"></script>
  <script src="/app.js"></script>
</body>
</html>
